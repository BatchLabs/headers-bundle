name: Tests
on: [push, pull_request]
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
        composer-flags: [null]
        include:
          # The lowest allowed dependency set only needs to hold on the lowest supported PHP.
          - php-version: "8.2"
            composer-flags: --prefer-lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer update ${{ matrix.composer-flags }} --no-interaction --no-progress --prefer-dist --ansi
      - run: ./vendor/bin/phpunit --color=always
